<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEGA API Studio — скилл для ИИ-кодинга</title>
<meta name="description" content="Установи скилл в любой ИИ для кодинга и скажи использовать SKILL в приложении. Генерация картинок, видео, озвучки и музыки через api.vega.chat.">
<style>
  :root {
    --bg: #fafafa;
    --text: #111;
    --muted: #6b7280;
    --accent: #0d9488;
    --accent-bg: #d9f2e5;
    --card-bg: #fff;
    --card-border: #e5e7eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    text-align: center;
    max-width: 860px;
    width: 100%;
    animation: fade-up .6s ease both;
  }
  .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--accent);
    font-size: 15px;
    letter-spacing: .08em;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(30px, 5.4vw, 52px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.08;
    margin-bottom: 16px;
  }
  .sub {
    color: var(--muted);
    font-size: clamp(15px, 2.2vw, 19px);
    line-height: 1.55;
    margin-bottom: 44px;
  }
  .cmd-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 14px 14px 24px;
    max-width: 640px;
    margin: 0 auto;
    box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05);
  }
  .cmd {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px;
    text-align: left;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    user-select: all;
    padding: 6px 0;
  }
  .cmd::-webkit-scrollbar { display: none; }
  .copy-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: none;
    cursor: pointer;
    background: var(--accent-bg);
    color: var(--accent);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 9px;
    transition: background .15s ease, transform .1s ease;
  }
  .copy-btn:hover { background: #c9ecd9; }
  .copy-btn:active { transform: scale(.97); }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-btn svg { width: 15px; height: 15px; }
  .copy-btn.done { background: var(--accent); color: #fff; }
  footer {
    margin-top: 56px;
    font-size: 14px;
    color: var(--muted);
    animation: fade-up .6s .15s ease both;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero, footer { animation: none; }
  }
</style>
</head>
<body>

<main class="hero">
  <div class="tag">// skill</div>
  <h1>Создай свой AI продукт с&nbsp;API&nbsp;ВЕГА</h1>
  <p class="sub">Установи в любой ИИ для кодинга и скажи использовать SKILL в приложении</p>

  <div class="cmd-card">
    <code class="cmd" id="cmd">npx skills add lingeniare/vega-skill -g -y</code>
    <button class="copy-btn" id="copyBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span id="copyLabel">Копировать</span>
    </button>
  </div>
</main>

<footer>
  <a href="https://github.com/lingeniare/vega-skill">github.com/lingeniare/vega-skill</a>
</footer>

<script>
  const btn = document.getElementById('copyBtn');
  const label = document.getElementById('copyLabel');
  const text = document.getElementById('cmd').textContent.trim();
  let timer;

  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    btn.classList.add('done');
    label.textContent = 'Скопировано';
    clearTimeout(timer);
    timer = setTimeout(() => {
      btn.classList.remove('done');
      label.textContent = 'Копировать';
    }, 2000);
  });
</script>

</body>
</html>
